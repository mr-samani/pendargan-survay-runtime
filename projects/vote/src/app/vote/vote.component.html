@if (isLoading()) {
  Loading...
} @else {
  @for (question of vote.questionList(); track question.uniqueId) {
    @if (question.canShow()) {
      <div class="question">
        <question-title [question]="question"></question-title>
        <ng-container
          [ngComponentOutlet]="question.component"
          [ngComponentOutletInputs]="{ question }"
        ></ng-container>
      </div>
    }
  }
}

<pre>{{ vote.form | json }}</pre>
