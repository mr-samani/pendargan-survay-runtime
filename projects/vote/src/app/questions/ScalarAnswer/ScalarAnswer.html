@let q = question();
<section class="scalar-answer">
  @if (isLongText) {
    <textarea
      [value]="currentValue"
      [disabled]="isReadOnly"
      [required]="q.isRequired === true"
      [attr.minlength]="q.minimumAnswer ?? null"
      [attr.maxlength]="q.maximumAnswer ?? 1000"
      (input)="update($any($event.target).value)"
    ></textarea>
  } @else {
    <input
      [type]="inputType"
      [value]="currentValue"
      [disabled]="isReadOnly"
      [required]="q.isRequired === true"
      [attr.min]="q.questionType === types.Numeric ? q.minimumAnswer ?? null : q.questionType === types.Date ? minimumDate : null"
      [attr.max]="q.questionType === types.Numeric ? q.maximumAnswer ?? null : q.questionType === types.Date ? maximumDate : null"
      [attr.minlength]="q.questionType === types.Numeric ? null : q.minimumAnswer ?? null"
      [attr.maxlength]="q.questionType === types.Numeric ? null : q.maximumAnswer ?? 1000"
      [attr.step]="numericStep"
      autocomplete="off"
      (input)="update($any($event.target).value)"
    />
  }
  @if (q.invalid() && validationError; as errorKey) {
    <p class="error-message">{{ errorKey | translate }}</p>
  }
</section>
