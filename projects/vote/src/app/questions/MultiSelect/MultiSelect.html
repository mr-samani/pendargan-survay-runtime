@let q = question();
<div class="option-container" [class.vertical-layout]="q.questionDirection == 1">
  @for (a of q.questionOptions; track a.uniqueId) {
    <label
      class="checkbox checkbox-horizontal"
      [class.dontShow]="!a.canShow"
      [class.selected]="vote.form['@Q' + question().fid]['A' + a.fid]"
      [class.disabled]="a.disabled || disabled()"
      [class.fullQuota]="a.fullQuota"
      [title]="a.fullQuota ? ('ThisOptionIsFull' | translate) : ''"
    >
      <input
        type="checkbox"
        [id]="'answer_Q' + q.fid + '_A' + a.fid"
        [(ngModel)]="vote.form['@Q' + question().fid]['A' + a.fid]"
        (change)="selectionChange()"
        [name]="'chk' + q.fid + '-' + a.fid"
        [disabled]="a.disabled || disabled()"
      />
      <span class="box"></span>
      <span [innerHtml]="a.title | safeHtml"></span>

      @if (a.remainedCount && a.remainedCount > 0) {
        <span class="remained-count">
          ({{ 'RemainingCount' | translate }}{{ a.remainedCount | number }}
          @if (q.settings?.['clusterRemaingCountPrefix']) {
            <span>{{ q.settings?.['clusterRemaingCountPrefix'] }}</span>
          }
          )
        </span>
      }
    </label>

    <!-- ------------------------------answer description---------------------------------- -->
    @if (a.hasDescriptiveAnswer && vote.form['@Q' + question().fid]['A' + a.fid]) {
      <div class="mt-3 w-100">
        <div class="col-sm-6">
          @if (a.descriptionType === DescriptionValueTypeEnum.Integer) {
            <input
              data-testid="description"
              class="form-control"
              numberCheck
              [(ngModel)]="a.answerDescription"
              [name]="'desc' + a.fid"
              [required]="a.requiredDescription == true"
              #txtDesc="ngModel"
              [placeholder]="
                a.descriptionPlaceholder ? a.descriptionPlaceholder : ('Description' | translate)
              "
              [class.invalid-question]="txtDesc.invalid"
              (blur)="onChangeDescription()"
            />
            <!-- @if (
                (txtDesc && txtDesc.hasError('required')) ||
                myControl.hasError('errorOnRequiredDescrpition')
              ) {
                <div class="mat-error">
                  {{ 'ThisFieldIsRequire' | translate }}
                </div>
              } -->
          } @else {
            <textarea
              data-testid="description"
              class="form-control"
              rows="3"
              [(ngModel)]="a.answerDescription"
              [name]="'desc' + a.fid"
              [required]="a.requiredDescription == true"
              #txtDesc="ngModel"
              [placeholder]="
                a.descriptionPlaceholder ? a.descriptionPlaceholder : ('Description' | translate)
              "
              [class.invalid-question]="txtDesc.invalid"
              (blur)="onChangeDescription()"
            ></textarea>
            <!-- @if (
                (txtDesc && txtDesc.hasError('required')) ||
                myControl.hasError('errorOnRequiredDescrpition')
              ) {
                <div class="mat-error">
                  {{ 'ThisFieldIsRequire' | translate }}
                </div>
              } -->
          }
        </div>
      </div>
    }
  }
</div>
