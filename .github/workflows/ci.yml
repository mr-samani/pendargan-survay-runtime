name: CI

on:
  push:
    branches:
      - master
      - 'docs/**'
      - 'feat/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production with source maps
        run: |
          npm run build -- --source-map
          node tools/analyze-bundle-sources.mjs
      - name: Upload bundle attribution report
        uses: actions/upload-artifact@v4
        with:
          name: angular-bundle-attribution-${{ github.run_id }}
          path: dist/bundle-attribution.json
          if-no-files-found: error
          retention-days: 14
      - name: Run unit tests and opt-in runtime benchmarks
        env:
          RUN_RUNTIME_BENCHMARKS: '1'
        run: npm test -- --watch=false
