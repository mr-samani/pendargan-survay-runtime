name: CI

on:
  push:
    branches:
      - master
      - 'docs/**'
      - 'feat/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production with bundle statistics
        run: |
          npm run build -- --stats-json
          echo "Generated build statistics:"
          find dist -type f -name stats.json -print
      - name: Upload Angular build statistics
        uses: actions/upload-artifact@v4
        with:
          name: angular-production-stats-${{ github.run_id }}
          path: dist/**/stats.json
          if-no-files-found: error
          retention-days: 14
      - name: Run unit tests
        run: npm test -- --watch=false
