<div class="emoji-container" [class.emoji-small]="item.size == 1">
  @for (opt of item.questionOptions; track opt) {
    <div
      class="emoji-item size-{{ item.size }}"
      [class.selected]="opt.uniqueId === myControl.value"
      (click)="selectEmoji(opt)"
      [title]="opt.title"
      [id]="'emoji_Q' + item.fid + '_A' + opt.fid"
      [class.dontShow]="opt.dontShow"
      [class.disabled]="disabled">
      <div class="emoji">
        <img [src]="opt.settings['imageUrl']" />
      </div>
      <div class="emoji-title">{{ opt.title }}</div>
      <div class="checkmark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
          <path
            d="M440.1 103C450.3 112.4 450.3 127.6 440.1 136.1L176.1 400.1C167.6 410.3 152.4 410.3 143 400.1L7.029 264.1C-2.343 255.6-2.343 240.4 7.029 231C16.4 221.7 31.6 221.7 40.97 231L160 350.1L407 103C416.4 93.66 431.6 93.66 440.1 103V103z" />
        </svg>
      </div>
    </div>
  }
</div>

@if (!disabled && !item.isRequired && myControl.value) {
  <div>
    <button class="btn-sm btn btn-warning my-2" type="button" (click)="clear()">
      {{ 'ClearAnswer' | translate }}
    </button>
  </div>
}
