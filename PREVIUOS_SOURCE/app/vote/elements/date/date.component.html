<div
  [class.col-sm-4]="item.size === 1 || item.size === null"
  [class.col-sm-6]="item.size === 2"
  [class.col-sm-12]="item.size === 3">
  <div class="input-group p-0" [id]="'date_Q' + item.fid">
    @if (myControl.value) {
      <span class="input-group-text" (click)="clear()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" class="svg-icon">
          <path
            d="M315.3 411.3c-6.253 6.253-16.37 6.253-22.63 0L160 278.6l-132.7 132.7c-6.253 6.253-16.37 6.253-22.63 0c-6.253-6.253-6.253-16.37 0-22.63L137.4 256L4.69 123.3c-6.253-6.253-6.253-16.37 0-22.63c6.253-6.253 16.37-6.253 22.63 0L160 233.4l132.7-132.7c6.253-6.253 16.37-6.253 22.63 0c6.253 6.253 6.253 16.37 0 22.63L182.6 256l132.7 132.7C321.6 394.9 321.6 405.1 315.3 411.3z" />
        </svg>
      </span>
    }
    @if (!_disabled) {
      <input
        class="form-control"
        [placeholder]="'SelectDate' | translate"
        [matDatepicker]="dpS"
        [formControl]="myControl"
        (dateChange)="dateChange()"
        [attr.readonly]="true"
        (click)="_disabled ? '' : dpS.open()"
        [min]="item.settings?.minDate || beforeDate"
        [max]="item.settings?.maxDate || afterDate" />
    }
    @if (_disabled) {
      <input
        class="form-control"
        [placeholder]="'SelectDate' | translate"
        [value]="myControl.value ? (myControl.value | luxonFormat: 'D') : ''"
        readonly
        disabled />
    }
    <mat-datepicker touchUi #dpS></mat-datepicker>
    <span class="input-group-text" (click)="_disabled ? '' : dpS.open()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="svg-icon">
        <path
          d="M64 264C64 241.9 81.91 224 104 224H184C206.1 224 224 241.9 224 264V344C224 366.1 206.1 384 184 384H104C81.91 384 64 366.1 64 344V264zM96 264V344C96 348.4 99.58 352 104 352H184C188.4 352 192 348.4 192 344V264C192 259.6 188.4 256 184 256H104C99.58 256 96 259.6 96 264zM128 64H320V16C320 7.164 327.2 0 336 0C344.8 0 352 7.164 352 16V64H384C419.3 64 448 92.65 448 128V448C448 483.3 419.3 512 384 512H64C28.65 512 0 483.3 0 448V128C0 92.65 28.65 64 64 64H96V16C96 7.164 103.2 0 112 0C120.8 0 128 7.164 128 16V64zM32 448C32 465.7 46.33 480 64 480H384C401.7 480 416 465.7 416 448V192H32V448zM32 128V160H416V128C416 110.3 401.7 96 384 96H64C46.33 96 32 110.3 32 128z" />
      </svg>
    </span>

    @if (myControl.hasError('matDatepickerMin') || myControl.hasError('matDatepickerMax')) {
      <div class="mat-error">
        {{ 'DateRangeIsIncorrect' | translate }}
      </div>
    }
    @if (myControl.hasError('matDatepickerParse')) {
      <div class="mat-error">
        {{ 'DateFormatIsIncorrect' | translate }}
      </div>
    }
  </div>
</div>
