<div cdkDrag cdkDragRootElement=".cdk-overlay-pane" mat-dialog-title>
  <h5 cdkDragHandle class="title">DevLog</h5>
  <button type="button" class="close-btn" aria-label="Close" mat-dialog-close mat-icon-button>
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<mat-dialog-content style="height: 96vh">
  @if (data) {
    <app-voter-details [data]="data"></app-voter-details>
  }
  
</mat-dialog-content>
