<div cdkDrag cdkDragRootElement=".cdk-overlay-pane" mat-dialog-title>
  <h5 cdkDragHandle class="title">{{ title }}</h5>
  <button type="button" class="close-btn" aria-label="Close" mat-dialog-close mat-icon-button>
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<mat-dialog-content class="dialog-container">
  @if (fileInfo && fileInfo.htmlResponseContent) {
    <div
      class="my-3"
    [innerHTML]="fileInfo.htmlResponseContent | safeHtml"></div>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <div class="flex justify-content-between">
    <button mat-raised-button mat-dialog-close color="primary" type="button">
      {{ 'Close' | translate }}
    </button>
  </div>
</mat-dialog-actions>
